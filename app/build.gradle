import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// MobSur app this demo talks to: https://app.mobsur.com/user/apps
def defaultMobSurAppId = '36121162-25d6-40f1-ab24-d5bd87a47601'

android {
    namespace 'com.example.mobsurandroiddemo'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.mobsurandroiddemo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Debug builds can point at another app or backend without code changes, e.g.
            // ./gradlew installDebug -Pmobsur.appId=<id> -Pmobsur.baseUrl=http://10.0.2.2:8000/
            def appId = project.findProperty('mobsur.appId') ?: defaultMobSurAppId
            def baseUrl = project.findProperty('mobsur.baseUrl')
            buildConfigField 'String', 'MOBSUR_APP_ID', "\"${appId}\""
            buildConfigField 'String', 'MOBSUR_BASE_URL', baseUrl ? "\"${baseUrl}\"" : 'null'
        }
        release {
            buildConfigField 'String', 'MOBSUR_APP_ID', "\"${defaultMobSurAppId}\""
            buildConfigField 'String', 'MOBSUR_BASE_URL', 'null'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    // MobSur Android SDK 1.4.0. Its only extra dependency is material (above).
    implementation files('libs/mobsur.aar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
